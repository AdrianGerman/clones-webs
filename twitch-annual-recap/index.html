<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resumen de Twitch de 2024 - Twitch</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <h1>Tus streamers favoritos/as del año</h1>
      <div class="content">
        <div class="primary">
          <div class="image-section">
            <video autoplay loop muted playsinline>
              <source
                src="https://static-cdn.jtvnw.net/c3-vg/recap/common/motion/purple-aura.webm"
                type="video/webm"
              />
            </video>
            <div class="text-overlay">
              <h2>Canal más visto</h2>
            </div>
            <div class="image-overlay">
              <img
                src="https://static-cdn.jtvnw.net/jtv_user_pictures/0107210e-a98c-409d-92a6-1caf70bb3953-profile_image-150x150.png"
                alt="imagen de tu streamer más visto"
              />
            </div>
          </div>

          <div class="info-section">
            <h2>ElMariana</h2>
            <div class="stats">
              <div>
                <span>Horas de visualización</span>
                <p>253</p>
              </div>
              <div>
                <span>Mensajes enviados en el chat</span>
                <p>74</p>
              </div>
              <div>
                <span>Puntos de canal ganados</span>
                <p>100.887</p>
              </div>
              <div>
                <span>Puntos de canal usados</span>
                <p>2212</p>
              </div>
            </div>
          </div>
        </div>

        <div class="secondary">
          <div></div>
          <div></div>
          <div></div>
          <div></div>
        </div>
      </div>
    </main>
  </body>
</html>
